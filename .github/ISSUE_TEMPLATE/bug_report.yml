name: "Zgłoszenie błędu"
description: "Zgłoś błąd lub problem w działaniu TekstLab"
title: "[Błąd] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## ⚠️ Ważna informacja o prywatności
        Zgłoszenia na GitHub Issues są **publiczne** i mogą ujawniać Twoją nazwę użytkownika GitHub.
        **Nie wklejaj** prywatnych dokumentów, danych osobowych ani treści wrażliwych.
        Jeśli wolisz anonimowość, użyj alternatywnego formularza (kontakt przez właściciela projektu).

  - type: textarea
    id: description
    attributes:
      label: Opis problemu
      description: "Opisz, co się stało. Co oczekiwałeś? Co się wydarzyło?"
      placeholder: "Opisz problem..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Kroki do odtworzenia
      description: "Jak odtworzyć problem? Podaj kroki."
      placeholder: |
        1. Otwórz stronę...
        2. Wklej tekst...
        3. Kliknij...
        4. Zauważysz...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Oczekiwane zachowanie
      description: "Co powinno się wydarzyć?"
      placeholder: "Oczekiwałem..."
    validations:
      required: false

  - type: textarea
    id: actual
    attributes:
      label: Rzeczywiste zachowanie
      description: "Co się faktycznie wydarzyło?"
      placeholder: "Faktycznie..."
    validations:
      required: false

  - type: dropdown
    id: browser
    attributes:
      label: Przeglądarka (opcjonalnie)
      description: "Z jakiej przeglądarki korzystasz?"
      options:
        - Chrome
        - Firefox
        - Edge
        - Safari
        - Inna
    validations:
      required: false

  - type: dropdown
    id: device
    attributes:
      label: Urządzenie (opcjonalnie)
      description: "Z jakiego urządzenia korzystasz?"
      options:
        - Komputer
        - Telefon
        - Tablet
    validations:
      required: false

  - type: textarea
    id: screenshot
    attributes:
      label: Zrzut ekranu (opcjonalnie)
      description: "Jeśli masz zrzut ekranu, wklej link. **Nie wklejaj danych prywatnych.**"
      placeholder: "Link do zrzutu ekranu..."
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---
        **Przypomnienie:** Zgłoszenia są publiczne. Nie wklejaj prywatnych dokumentów, danych osobowych ani treści wrażliwych.
        Korzystanie z GitHub Issues podlega [Zasadom GitHub](https://docs.github.com/en/site-policy/github-terms/github-terms-of-service).
